<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b2cbf">
  <meta name="description" content="Joury Carb & Insulin Calculator">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Joury">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Joury Carb & Insulin Calculator</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #7b2cbf;
    }
    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    title="Joury Carb & Insulin Calculator"
    src="https://script.google.com/macros/s/AKfycbzDFfORJjUh_se6l3fk7VGhpne0d2XZ54iqycHwBX5VkNxZs7UQC9blAu4ZuExoaoY_/exec"
    allow="notifications; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => {
          console.warn("Joury service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
